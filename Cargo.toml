[workspace]
members = [
    ".",
    "crates/postman-http",
    "crates/postman-request"
]
resolver = "2"

[workspace.package]
name = "postman-gpui"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
authors = ["847850277"]
description = "A native, cross-platform HTTP client built with Rust and GPUI"
license = "MIT"
repository = "https://github.com/847850277/postman-gpui"
homepage = "https://github.com/847850277/postman-gpui"
readme = "README.md"
keywords = ["http", "api", "client", "gpui"]
categories = ["development-tools"]

[package]
name = "postman-gpui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "a8fafdd7ee36fb3fb98ebbfe5d3be983301d9e74" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "a8fafdd7ee36fb3fb98ebbfe5d3be983301d9e74", features = ["font-kit", "wayland", "x11"] }
anyhow = "1.0.75" 
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["brotli", "cookies", "deflate", "gzip", "json", "multipart"] }
unicode-segmentation = "1.10"
serde_json = "1.0"
chrono = "0.4"
directories = "6.0"
form_urlencoded = "1.2"
mime_guess = "2"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
embed-resource = "3.0"

[dev-dependencies]
brotli = "8"
flate2 = "1"
gpui = { git = "https://github.com/zed-industries/zed", rev = "a8fafdd7ee36fb3fb98ebbfe5d3be983301d9e74", features = ["test-support"] }
mockito = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
