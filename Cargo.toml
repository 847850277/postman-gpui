[package]
name = "postman-gpui"
version = "0.1.0"
edition = "2021"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "a8fafdd7ee36fb3fb98ebbfe5d3be983301d9e74" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "a8fafdd7ee36fb3fb98ebbfe5d3be983301d9e74", features = ["font-kit"] }
anyhow = "1.0.75" 
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
unicode-segmentation = "1.10"
serde_json = "1.0"
chrono = "0.4"
form_urlencoded = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "a8fafdd7ee36fb3fb98ebbfe5d3be983301d9e74", features = ["test-support"] }
mockito = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
