[workspace]
members = [
    ".",
    "crates/postman-cli",
    "crates/postman-flow",
    "crates/postman-flow-e2e",
    "crates/postman-flow-mcp",
    "crates/postman-http",
    "crates/postman-request"
]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.90"
authors = ["847850277"]
description = "A native, cross-platform HTTP client built with Rust and GPUI"
license = "MIT"
repository = "https://github.com/847850277/postman-gpui"
homepage = "https://github.com/847850277/postman-gpui"
readme = "README.md"
keywords = ["http", "api", "client", "gpui"]
categories = ["development-tools"]

[package]
name = "postman-gpui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
postman-http = { path = "crates/postman-http" }
postman-request = { path = "crates/postman-request" }
postman-flow = { path = "crates/postman-flow" }
futures = "0.3"
# Kit owns the matching GPUI snapshot, platform backends, and controls.
gpui-kit = "=0.7.3"
anyhow = "1.0.75"
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["brotli", "cookies", "deflate", "gzip", "json", "multipart"] }
unicode-segmentation = "1.10"
serde_json = "1.0"
chrono = "0.4"
directories = "6.0"
form_urlencoded = "1.2"
mime_guess = "2"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
embed-resource = "3.0"

[dev-dependencies]
brotli = "8"
flate2 = "1"
gpui-kit = { version = "=0.7.3", features = ["test-support"] }
mockito = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
