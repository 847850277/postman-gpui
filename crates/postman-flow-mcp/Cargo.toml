[package]
name = "postman-flow-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "MCP server for creating and validating postman-flow YAML workflows"
license.workspace = true
repository.workspace = true

[[bin]]
name = "postman-flow-mcp"
path = "src/main.rs"

[dependencies]
postman-flow = { path = "../postman-flow" }
rmcp = { version = "3.4.0", features = ["schemars", "server", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
yaml_serde = "0.10.7"

[dev-dependencies]
tempfile = "3"
