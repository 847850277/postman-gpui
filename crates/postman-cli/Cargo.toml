[package]
name = "postman-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Headless .http / .http.yml runner for postman-gpui"
license.workspace = true
repository.workspace = true
readme = "README.md"

[[bin]]
name = "postman-g"
path = "src/main.rs"

[dependencies]
futures = "0.3"
postman-flow = { path = "../postman-flow" }
postman-http = { path = "../postman-http" }
postman-request = { path = "../postman-request" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[features]
default = ["sql"]
sql = ["postman-flow/sql"]
