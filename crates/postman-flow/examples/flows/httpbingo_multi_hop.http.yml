flow:
  inputs:
  - default: https://httpbingo.org
    name: host
  - default: USR-8888
    name: user_id
  - default: 北京市海淀区中关村南大街 1 号
    name: shipping_address
  name: e-commerce-multi-hop-pipeline
  steps:
  - checks:
    - equals: 200
      kind: status
    exports:
    - name: auth_token
      path: $.uuid
      sensitive: true
    id: step-1-auth
    name: 1. 用户登录获取 AuthToken
    request:
      headers:
      - name:
          literal: Accept
        value:
          literal: application/json
      kind: http
      method: GET
      url:
        concat:
        - input: host
        - literal: /uuid
  - checks:
    - equals: 200
      kind: status
    exports:
    - name: draft_order_id
      path: $.json.order_id
    - name: total_amount
      path: $.json.amount
    id: step-2-create-draft-order
    name: 2. 创建交易草稿订单
    request:
      body:
        kind: json
        value:
          object:
            amount:
              literal: '7999.00'
            buyer_id:
              input: user_id
            order_id:
              literal: ORD-2026-9001
            quantity:
              literal: 1
            sku_id:
              literal: SKU-IPHONE-16
      headers:
      - name:
          literal: Authorization
        value:
          concat:
          - literal: 'Bearer '
          - output:
              name: auth_token
              step: step-1-auth
      - name:
          literal: Content-Type
        value:
          literal: application/json
      kind: http
      method: POST
      url:
        concat:
        - input: host
        - literal: /anything/orders/draft
  - checks:
    - equals: 200
      kind: status
    - equals:
        output:
          name: draft_order_id
          step: step-2-create-draft-order
      kind: jsonpath
      path: $.json.target_order_id
    exports:
    - name: payment_txn_id
      path: $.json.gateway_txn_id
    - name: pay_signature
      path: $.json.signature
    id: step-3-create-payment-txn
    name: 3. 根据草稿订单发起支付申请
    request:
      body:
        kind: json
        value:
          object:
            channel:
              literal: ALIPAY
            gateway_txn_id:
              literal: TXN-PAY-556677
            pay_amount:
              output:
                name: total_amount
                step: step-2-create-draft-order
            signature:
              literal: SIG-SEC-XYZ999
            target_order_id:
              output:
                name: draft_order_id
                step: step-2-create-draft-order
      headers:
      - name:
          literal: Authorization
        value:
          concat:
          - literal: 'Bearer '
          - output:
              name: auth_token
              step: step-1-auth
      - name:
          literal: Content-Type
        value:
          literal: application/json
      kind: http
      method: POST
      url:
        concat:
        - input: host
        - literal: /anything/pay/gateway/create
  - checks:
    - equals: 200
      kind: status
    - equals:
        output:
          name: payment_txn_id
          step: step-3-create-payment-txn
      kind: jsonpath
      path: $.json.txn_id
    exports:
    - name: clearing_receipt_no
      path: $.json.receipt_no
    id: step-4-confirm-payment
    name: 4. 凭支付流水与签名提交银行清算核销
    request:
      body:
        kind: json
        value:
          object:
            clear_status:
              literal: CLEARED
            receipt_no:
              literal: RCPT-BANK-2026-8888
            txn_id:
              output:
                name: payment_txn_id
                step: step-3-create-payment-txn
            verify_sign:
              output:
                name: pay_signature
                step: step-3-create-payment-txn
      headers:
      - name:
          literal: Content-Type
        value:
          literal: application/json
      kind: http
      method: POST
      url:
        concat:
        - input: host
        - literal: /anything/pay/clearing/confirm
  - checks:
    - equals: 200
      kind: status
    - equals:
        output:
          name: draft_order_id
          step: step-2-create-draft-order
      kind: jsonpath
      path: $.json.order_id
    - equals:
        output:
          name: payment_txn_id
          step: step-3-create-payment-txn
      kind: jsonpath
      path: $.json.payment_txn_id
    - equals:
        output:
          name: clearing_receipt_no
          step: step-4-confirm-payment
      kind: jsonpath
      path: $.json.receipt_no
    id: step-5-fulfillment-dispatch
    name: 5. 汇总全链路单据，通知仓库发货
    request:
      body:
        kind: json
        value:
          object:
            destination:
              input: shipping_address
            order_id:
              output:
                name: draft_order_id
                step: step-2-create-draft-order
            payment_txn_id:
              output:
                name: payment_txn_id
                step: step-3-create-payment-txn
            receipt_no:
              output:
                name: clearing_receipt_no
                step: step-4-confirm-payment
      headers:
      - name:
          literal: Authorization
        value:
          concat:
          - literal: 'Bearer '
          - output:
              name: auth_token
              step: step-1-auth
      - name:
          literal: Content-Type
        value:
          literal: application/json
      kind: http
      method: POST
      url:
        concat:
        - input: host
        - literal: /anything/warehouse/dispatch
schema_version: 1
