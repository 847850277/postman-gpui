[package]
name = "postman-flow"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "HTTP flow definitions, YAML documents, compiler and streaming runtime"
license.workspace = true
repository.workspace = true

[dependencies]
uuid = { version = "1", features = ["v4"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

futures = "0.3"
postman-http = { path = "../postman-http" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
serde_path_to_error = "0.1"
yaml_serde = "0.10.7"
tracing = "0.1"
url = "2"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"], optional = true }
flate2 = { version = "1", features = ["rust_backend"], optional = true }
mysql = { version = "25", default-features = false, optional = true }
tokio = { version = "1", features = ["rt"], optional = true }

[features]
default = []
sql = ["dep:rusqlite", "dep:mysql", "dep:flate2", "dep:tokio"]

[dev-dependencies]
postman-request = { path = "../postman-request" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
