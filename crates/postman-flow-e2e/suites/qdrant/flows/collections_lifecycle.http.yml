schema_version: 1
flow:
  name: qdrant-collections-lifecycle-e2e
  inputs:
  - name: host
    default: http://127.0.0.1:6333

  steps:
  # 1. Health and Readiness Probe
  - id: step-1-ready-check
    name: 1. Health and Readiness Check
    request:
      kind: http
      method: GET
      url:
        concat:
        - input: host
        - literal: /readyz
    checks:
    - kind: status
      equals: 200

  # 2. Clean existing collection if present
  - id: step-2-clean-collection
    name: 2. Clean 'test_vectors' Collection If Exists
    request:
      kind: http
      method: DELETE
      url:
        concat:
        - input: host
        - literal: /collections/test_vectors
    checks:
    - kind: status
      equals: 200
    - kind: jsonpath
      path: $.status
      equals:
        literal: ok

  # 3. Create 'test_vectors' Collection with 4D Cosine Metric
  - id: step-3-create-collection
    name: 3. Create 4-Dimensional Cosine Collection
    request:
      kind: http
      method: PUT
      url:
        concat:
        - input: host
        - literal: /collections/test_vectors
      headers:
      - name:
          literal: Content-Type
        value:
          literal: application/json
      body:
        kind: raw
        value:
          literal: |
            {
              "vectors": {
                "size": 4,
                "distance": "Cosine"
              }
            }
    checks:
    - kind: status
      equals: 200
    - kind: jsonpath
      path: $.status
      equals:
        literal: ok
    - kind: jsonpath
      path: $.result
      equals:
        literal: true

  # 4. Get Collection Info and Verify Vector Configuration
  - id: step-4-get-collection-info
    name: 4. Verify Collection Parameters and Status
    request:
      kind: http
      method: GET
      url:
        concat:
        - input: host
        - literal: /collections/test_vectors
    checks:
    - kind: status
      equals: 200
    - kind: jsonpath
      path: $.status
      equals:
        literal: ok
    - kind: jsonpath
      path: $.result.status
      equals:
        literal: green
    - kind: jsonpath
      path: $.result.config.params.vectors.size
      equals:
        literal: 4
    - kind: jsonpath
      path: $.result.config.params.vectors.distance
      equals:
        literal: Cosine

  # 5. Create Secondary Collection with Dot Distance
  - id: step-5-create-dot-collection
    name: 5. Create Auxiliary Dot Product Collection
    request:
      kind: http
      method: PUT
      url:
        concat:
        - input: host
        - literal: /collections/test_dot_collection
      headers:
      - name:
          literal: Content-Type
        value:
          literal: application/json
      body:
        kind: raw
        value:
          literal: |
            {
              "vectors": {
                "size": 4,
                "distance": "Dot"
              }
            }
    checks:
    - kind: status
      equals: 200
    - kind: jsonpath
      path: $.status
      equals:
        literal: ok

  # 6. List Collections and Verify Both Exist
  - id: step-6-list-collections
    name: 6. List All Collections
    request:
      kind: http
      method: GET
      url:
        concat:
        - input: host
        - literal: /collections
    checks:
    - kind: status
      equals: 200
    - kind: jsonpath
      path: $.status
      equals:
        literal: ok

  # 7. Delete Auxiliary Dot Collection
  - id: step-7-delete-dot-collection
    name: 7. Delete Auxiliary Collection
    request:
      kind: http
      method: DELETE
      url:
        concat:
        - input: host
        - literal: /collections/test_dot_collection
    checks:
    - kind: status
      equals: 200
    - kind: jsonpath
      path: $.status
      equals:
        literal: ok
    - kind: jsonpath
      path: $.result
      equals:
        literal: true

