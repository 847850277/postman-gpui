schema_version: 1
apis:
  get-task:
    parameters: [host, master_key, task_uid]
    request:
      method: GET
      url:
        concat: [{input: host}, {literal: /tasks/}, {input: task_uid}]
      headers:
      - name: {literal: Authorization}
        value: {concat: [{literal: 'Bearer '}, {input: master_key}]}
flow:
  name: meilisearch-documents-ingest-e2e
  inputs:
  - name: host
    default: http://127.0.0.1:7700
  - name: master_key
    default: masterKey12345678901234567890

  steps:
  - id: step-1-health
    name: 1. Health Check
    request:
      kind: http
      method: GET
      url:
        concat:
        - input: host
        - literal: /health
    checks:
    - kind: status
      equals: 200

  - id: step-2-create-index
    name: 2. Create 'movies' Search Index
    request:
      kind: http
      method: POST
      url:
        concat:
        - input: host
        - literal: /indexes
      headers:
      - name:
          literal: Content-Type
        value:
          literal: application/json
      - name:
          literal: Authorization
        value:
          concat:
          - literal: 'Bearer '
          - input: master_key
      body:
        kind: raw
        value:
          literal: |
            {
              "uid": "movies",
              "primaryKey": "id"
            }
    checks:
    - kind: status
      equals: 202
    exports:
    - name: task_uid
      path: $.taskUid

  - id: wait-step-2-create-index
    kind: repeat_until
    max_iterations: 3000
    interval_ms: 100
    timeout_ms: 300000
    until:
      eq: [{output: {step: query-step-2-create-index, name: status}}, {literal: succeeded}]
    fail_when:
      in: [{output: {step: query-step-2-create-index, name: status}}, {literal: [failed, canceled]}]
    steps:
    - id: query-step-2-create-index
      request:
        kind: api
        api: get-task
        bindings:
          host: {input: host}
          master_key: {input: master_key}
          task_uid: {output: {step: step-2-create-index, name: task_uid}}
      checks:
      - kind: status
        equals: 200
      exports:
      - name: status
        path: $.status

  - id: step-3-add-documents
    name: 3. Ingest Documents into 'movies'
    request:
      kind: http
      method: POST
      url:
        concat:
        - input: host
        - literal: /indexes/movies/documents
      headers:
      - name:
          literal: Content-Type
        value:
          literal: application/json
      - name:
          literal: Authorization
        value:
          concat:
          - literal: 'Bearer '
          - input: master_key
      body:
        kind: raw
        value:
          literal: |
            [
              {
                "id": 1,
                "title": "Inception",
                "director": "Christopher Nolan",
                "genre": ["Sci-Fi", "Action"],
                "release_year": 2010
              },
              {
                "id": 2,
                "title": "Interstellar",
                "director": "Christopher Nolan",
                "genre": ["Sci-Fi", "Drama"],
                "release_year": 2014
              },
              {
                "id": 3,
                "title": "The Dark Knight",
                "director": "Christopher Nolan",
                "genre": ["Action", "Crime"],
                "release_year": 2008
              },
              {
                "id": 4,
                "title": "Pulp Fiction",
                "director": "Quentin Tarantino",
                "genre": ["Crime", "Drama"],
                "release_year": 1994
              }
            ]
    checks:
    - kind: status
      equals: 202
    exports:
    - name: task_uid
      path: $.taskUid

  - id: wait-step-3-add-documents
    kind: repeat_until
    max_iterations: 3000
    interval_ms: 100
    timeout_ms: 300000
    until:
      eq: [{output: {step: query-step-3-add-documents, name: status}}, {literal: succeeded}]
    fail_when:
      in: [{output: {step: query-step-3-add-documents, name: status}}, {literal: [failed, canceled]}]
    steps:
    - id: query-step-3-add-documents
      request:
        kind: api
        api: get-task
        bindings:
          host: {input: host}
          master_key: {input: master_key}
          task_uid: {output: {step: step-3-add-documents, name: task_uid}}
      checks:
      - kind: status
        equals: 200
      exports:
      - name: status
        path: $.status

  - id: step-4-update-settings
    name: 4. Configure Filterable and Sortable Attributes
    request:
      kind: http
      method: PATCH
      url:
        concat:
        - input: host
        - literal: /indexes/movies/settings
      headers:
      - name:
          literal: Content-Type
        value:
          literal: application/json
      - name:
          literal: Authorization
        value:
          concat:
          - literal: 'Bearer '
          - input: master_key
      body:
        kind: raw
        value:
          literal: |
            {
              "filterableAttributes": ["director", "genre", "release_year"],
              "sortableAttributes": ["release_year"]
            }
    checks:
    - kind: status
      equals: 202
    exports:
    - name: task_uid
      path: $.taskUid

  - id: wait-step-4-update-settings
    kind: repeat_until
    max_iterations: 3000
    interval_ms: 100
    timeout_ms: 300000
    until:
      eq: [{output: {step: query-step-4-update-settings, name: status}}, {literal: succeeded}]
    fail_when:
      in: [{output: {step: query-step-4-update-settings, name: status}}, {literal: [failed, canceled]}]
    steps:
    - id: query-step-4-update-settings
      request:
        kind: api
        api: get-task
        bindings:
          host: {input: host}
          master_key: {input: master_key}
          task_uid: {output: {step: step-4-update-settings, name: task_uid}}
      checks:
      - kind: status
        equals: 200
      exports:
      - name: status
        path: $.status
