schema_version: 1
apis:
  get-task:
    parameters: [host, master_key, task_uid]
    request:
      method: GET
      url:
        concat: [{input: host}, {literal: /tasks/}, {input: task_uid}]
      headers:
      - name: {literal: Authorization}
        value: {concat: [{literal: 'Bearer '}, {input: master_key}]}
flow:
  name: meilisearch-hackernews-streaming-e2e
  inputs:
  - name: host
    default: http://127.0.0.1:7700
  - name: master_key
    default: masterKey12345678901234567890
  - name: dataset_path
    default: crates/postman-flow-e2e/suites/meilisearch/data/hackernews_sample.ndjson

  steps:
  # 1. Clean / Delete existing 'hackernews' index if present
  - id: step-1-clean-index
    name: 1. Clean 'hackernews' Index
    request:
      kind: http
      method: DELETE
      url:
        concat:
        - input: host
        - literal: /indexes/hackernews
      headers:
      - name:
          literal: Authorization
        value:
          concat:
          - literal: 'Bearer '
          - input: master_key
    checks:
    - kind: status
      equals: 202
    exports:
    - name: task_uid
      path: $.taskUid

  - id: wait-step-1-clean-index
    kind: repeat_until
    max_iterations: 3000
    interval_ms: 100
    timeout_ms: 300000
    until:
      in: [{output: {step: query-step-1-clean-index, name: status}}, {literal: [succeeded, failed]}]
    fail_when:
      eq: [{output: {step: query-step-1-clean-index, name: status}}, {literal: canceled}]
    steps:
    - id: query-step-1-clean-index
      request:
        kind: api
        api: get-task
        bindings:
          host: {input: host}
          master_key: {input: master_key}
          task_uid: {output: {step: step-1-clean-index, name: task_uid}}
      checks:
      - kind: status
        equals: 200
      exports:
      - name: status
        path: $.status
    # A fresh server has no index to delete. Only this specific failure is harmless.
    - id: allow-missing-index
      when:
        eq: [{output: {step: query-step-1-clean-index, name: status}}, {literal: failed}]
      request:
        kind: api
        api: get-task
        bindings:
          host: {input: host}
          master_key: {input: master_key}
          task_uid: {output: {step: step-1-clean-index, name: task_uid}}
      checks:
      - kind: status
        equals: 200
      - kind: jsonpath
        path: $.error.code
        equals: {literal: index_not_found}

  # 2. Create 'hackernews' index with 'id' primary key
  - id: step-2-create-index
    name: 2. Create 'hackernews' Search Index
    request:
      kind: http
      method: POST
      url:
        concat:
        - input: host
        - literal: /indexes
      headers:
      - name:
          literal: Content-Type
        value:
          literal: application/json
      - name:
          literal: Authorization
        value:
          concat:
          - literal: 'Bearer '
          - input: master_key
      body:
        kind: raw
        value:
          literal: |
            {
              "uid": "hackernews",
              "primaryKey": "id"
            }
    checks:
    - kind: status
      equals: 202
    - kind: jsonpath
      path: $.status
      equals:
        literal: enqueued
    exports:
    - name: task_uid
      path: $.taskUid

  - id: wait-step-2-create-index
    kind: repeat_until
    max_iterations: 3000
    interval_ms: 100
    timeout_ms: 300000
    until:
      eq: [{output: {step: query-step-2-create-index, name: status}}, {literal: succeeded}]
    fail_when:
      in: [{output: {step: query-step-2-create-index, name: status}}, {literal: [failed, canceled]}]
    steps:
    - id: query-step-2-create-index
      request:
        kind: api
        api: get-task
        bindings:
          host: {input: host}
          master_key: {input: master_key}
          task_uid: {output: {step: step-2-create-index, name: task_uid}}
      checks:
      - kind: status
        equals: 200
      exports:
      - name: status
        path: $.status

  # 3. Stream NDJSON Dataset into 'hackernews' index via File Body
  - id: step-3-stream-hackernews-dataset
    name: 3. Stream HackerNews NDJSON Dataset via File Body
    request:
      kind: http
      method: POST
      url:
        concat:
        - input: host
        - literal: /indexes/hackernews/documents
      headers:
      - name:
          literal: Content-Type
        value:
          literal: application/x-ndjson
      - name:
          literal: Authorization
        value:
          concat:
          - literal: 'Bearer '
          - input: master_key
      body:
        kind: file
        value:
          input: dataset_path
    checks:
    - kind: status
      equals: 202
    - kind: jsonpath
      path: $.status
      equals:
        literal: enqueued
    - kind: jsonpath
      path: $.type
      equals:
        literal: documentAdditionOrUpdate
    exports:
    - name: task_uid
      path: $.taskUid

  - id: wait-step-3-stream-hackernews-dataset
    kind: repeat_until
    max_iterations: 3000
    interval_ms: 100
    timeout_ms: 300000
    until:
      eq: [{output: {step: query-step-3-stream-hackernews-dataset, name: status}}, {literal: succeeded}]
    fail_when:
      in: [{output: {step: query-step-3-stream-hackernews-dataset, name: status}}, {literal: [failed, canceled]}]
    steps:
    - id: query-step-3-stream-hackernews-dataset
      request:
        kind: api
        api: get-task
        bindings:
          host: {input: host}
          master_key: {input: master_key}
          task_uid: {output: {step: step-3-stream-hackernews-dataset, name: task_uid}}
      checks:
      - kind: status
        equals: 200
      exports:
      - name: status
        path: $.status

  # 4. Configure Filterable and Searchable Settings
  - id: step-4-update-settings
    name: 4. Configure Filterable and Searchable Settings
    request:
      kind: http
      method: PATCH
      url:
        concat:
        - input: host
        - literal: /indexes/hackernews/settings
      headers:
      - name:
          literal: Content-Type
        value:
          literal: application/json
      - name:
          literal: Authorization
        value:
          concat:
          - literal: 'Bearer '
          - input: master_key
      body:
        kind: raw
        value:
          literal: |
            {
              "filterableAttributes": ["by", "type"],
              "searchableAttributes": ["title", "text", "by"]
            }
    checks:
    - kind: status
      equals: 202
    - kind: jsonpath
      path: $.status
      equals:
        literal: enqueued
    exports:
    - name: task_uid
      path: $.taskUid

  - id: wait-step-4-update-settings
    kind: repeat_until
    max_iterations: 3000
    interval_ms: 100
    timeout_ms: 300000
    until:
      eq: [{output: {step: query-step-4-update-settings, name: status}}, {literal: succeeded}]
    fail_when:
      in: [{output: {step: query-step-4-update-settings, name: status}}, {literal: [failed, canceled]}]
    steps:
    - id: query-step-4-update-settings
      request:
        kind: api
        api: get-task
        bindings:
          host: {input: host}
          master_key: {input: master_key}
          task_uid: {output: {step: step-4-update-settings, name: task_uid}}
      checks:
      - kind: status
        equals: 200
      exports:
      - name: status
        path: $.status
