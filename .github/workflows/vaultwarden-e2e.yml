name: Vaultwarden E2E Tests

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'crates/postman-flow/**'
      - 'crates/postman-flow-e2e/**'
      - 'crates/postman-cli/**'
      - '.github/workflows/vaultwarden-e2e.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'crates/postman-flow/**'
      - 'crates/postman-flow-e2e/**'
      - 'crates/postman-cli/**'
      - '.github/workflows/vaultwarden-e2e.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: '1.97.0'

jobs:
  vaultwarden-e2e:
    name: Vaultwarden API E2E Suite
    runs-on: ubuntu-latest

    services:
      vaultwarden:
        image: vaultwarden/server:latest
        ports:
          - 8088:80
        env:
          I_REALLY_WANT_VOLATILE_STORAGE: 'true'
          SIGNUPS_ALLOWED: 'true'
          WEB_VAULT_ENABLED: 'false'
          LOG_LEVEL: 'warn'
          LOGIN_RATELIMIT_MAX_BURST: '1000'
          UNAUTHENTICATED_RATELIMIT_MAX_BURST: '1000'
          ADMIN_TOKEN: 'testadmin1234567890'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Cache cargo registry & target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-vaultwarden-e2e-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-vaultwarden-e2e-

      - name: Build postman-g CLI
        run: cargo build --locked -p postman-cli --bin postman-g

      - name: Wait for Vaultwarden Service Health
        run: |
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8088/alive; then
              echo "Vaultwarden service is healthy!"
              exit 0
            fi
            sleep 1
          done
          echo "Vaultwarden service timed out" >&2
          exit 1

      - name: Run Vaultwarden E2E Integration Test Suite
        env:
          VAULTWARDEN_URL: 'http://127.0.0.1:8088'
        run: cargo test --locked -p postman-flow-e2e --test vaultwarden_e2e -- --nocapture

      - name: Run Full Flow Suite via postman-g CLI
        run: |
          target/debug/postman-g run crates/postman-flow-e2e/suites/vaultwarden/flows/login.http.yml --input host=http://127.0.0.1:8088 --json
          target/debug/postman-g run crates/postman-flow-e2e/suites/vaultwarden/flows/send.http.yml --input host=http://127.0.0.1:8088 --json
