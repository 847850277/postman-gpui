name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.97.0"

jobs:
  request-scenarios:
    name: Request Scenario Contract
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Rust toolchain
      run: |
        rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
        rustup default "$RUST_TOOLCHAIN"

    - name: Cache cargo registry
      uses: actions/cache@v6
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v6
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v6
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-scenarios-${{ hashFiles('**/Cargo.lock') }}

    - name: Run request scenario contract
      run: cargo test --locked --test request_scenarios --verbose

  persistence-e2e:
    name: SQLite Persistence E2E
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Rust toolchain
      run: |
        rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
        rustup default "$RUST_TOOLCHAIN"

    - name: Cache cargo registry
      uses: actions/cache@v6
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v6
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache persistence E2E build
      uses: actions/cache@v6
      with:
        path: target
        key: ${{ runner.os }}-cargo-persistence-e2e-${{ hashFiles('**/Cargo.lock') }}

    - name: Run SQLite persistence E2E
      run: cargo history-persistence

  build-and-test:
    name: Build and Test
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Rust toolchain
      run: |
        rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
        rustup component add rustfmt clippy --toolchain "$RUST_TOOLCHAIN"
        rustup default "$RUST_TOOLCHAIN"

    - name: Cache cargo registry
      uses: actions/cache@v6
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v6
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v6
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Check code formatting
      run: cargo fmt -- --check

    - name: Run clippy
      run: cargo clippy --locked --all-targets --all-features -- -D warnings

    - name: Build project
      run: cargo build --locked --verbose

    - name: Run all tests
      run: cargo test --locked --all-targets --all-features --verbose

    - name: Build release
      run: cargo build --locked --release --verbose

  cross-platform-release-build:
    name: Release Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Rust toolchain
      shell: bash
      run: |
        rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
        rustup default "$RUST_TOOLCHAIN"

    - name: Cache Cargo dependencies and release output
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-release-

    - name: Install Linux build dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends \
          build-essential clang cmake libasound2-dev libfontconfig1-dev libvulkan1 \
          libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev pkg-config

    - name: Build locked release binary
      run: cargo build --locked --release --verbose

  release-configuration:
    name: Release Configuration
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Test release tooling
      run: python -m unittest discover -s scripts/tests

    - name: Validate v0.1 release metadata
      run: python scripts/release.py verify --tag v0.1.0-rc.1

  # Security audit
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Rust toolchain
      run: |
        rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
        rustup default "$RUST_TOOLCHAIN"

    - name: Install cargo-audit
      run: cargo install cargo-audit --locked

    - name: Run security audit
      run: cargo audit
