name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.97.0"

jobs:
  cli-installer:
    name: CLI Installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Check installer syntax
      run: /bin/bash -n install.sh

    - name: Test installer without network or Cargo
      run: python -m unittest discover -s scripts/tests -p test_install.py -v

  request-scenarios:
    name: Request Scenario Contract
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Rust toolchain
      run: |
        rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
        rustup default "$RUST_TOOLCHAIN"

    - name: Cache cargo registry
      uses: actions/cache@v6
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v6
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v6
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-scenarios-${{ hashFiles('**/Cargo.lock') }}

    - name: Run request scenario contract
      run: cargo test --locked --test request_scenarios --verbose

  persistence-e2e:
    name: SQLite Persistence E2E
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Rust toolchain
      run: |
        rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
        rustup default "$RUST_TOOLCHAIN"

    - name: Cache cargo registry
      uses: actions/cache@v6
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v6
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache persistence E2E build
      uses: actions/cache@v6
      with:
        path: target
        key: ${{ runner.os }}-cargo-persistence-e2e-${{ hashFiles('**/Cargo.lock') }}

    - name: Run SQLite persistence E2E
      run: cargo history-persistence

  build-and-test:
    name: Build and Test
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Rust toolchain
      run: |
        rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
        rustup component add rustfmt clippy --toolchain "$RUST_TOOLCHAIN"
        rustup default "$RUST_TOOLCHAIN"

    - name: Cache cargo registry
      uses: actions/cache@v6
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v6
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v6
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Check code formatting
      run: cargo fmt -- --check

    - name: Run clippy
      run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

    - name: Verify headless dependency boundaries
      run: |
        dependency_tree="$(cargo tree --locked --workspace --exclude postman-gpui)"
        if printf '%s\n' "$dependency_tree" | grep -E '(^|[[:space:]])gpui([_-][^[:space:]]+)? v'; then
          echo "Engine, CLI, and MCP crates must not depend on GPUI"
          exit 1
        fi

    - name: Build project
      run: cargo build --locked --workspace --verbose

    - name: Run all tests
      run: cargo test --locked --workspace --all-targets --all-features --verbose

    - name: Build pinned cURL for redirect compatibility checks
      shell: bash
      run: |
        curl_source="$RUNNER_TEMP/postman-curl"
        mkdir -p "$curl_source"
        cd "$curl_source"
        curl --fail --silent --show-error --location --output curl.tar.xz \
          https://curl.se/download/curl-8.16.0.tar.xz
        printf '%s  curl.tar.xz\n' 40c8cddbcb6cc6251c03dea423a472a6cea4037be654ba5cf5dec6eb2d22ff1d | shasum -a 256 -c -
        tar -xf curl.tar.xz
        cd curl-8.16.0
        sdk=$(xcrun --show-sdk-path)
        # Only loopback HTTP is tested; this executable is never installed.
        CPPFLAGS="-I$sdk/usr/include" LDFLAGS="-L$sdk/usr/lib" \
          ./configure --disable-shared --disable-dependency-tracking --without-ssl \
            --without-libpsl --without-libidn2 --without-zstd --without-brotli \
            --with-zlib="$sdk/usr" --disable-ldap --disable-ldaps --disable-manual
        make -j3
        printf 'POSTMAN_TEST_CURL=%s/src/curl\n' "$PWD" >> "$GITHUB_ENV"

    - name: Compare exported cURL commands with native redirects
      run: >-
        cargo test --locked --lib models::curl::tests::exported_commands_match_native_redirects_with_real_curl
        -- --ignored --nocapture

    - name: Build release
      run: cargo build --locked --release --verbose

  cross-platform-release-build:
    name: Release Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Python for release smoke
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install Rust toolchain
      shell: bash
      run: |
        rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
        rustup default "$RUST_TOOLCHAIN"

    - name: Cache Cargo dependencies and release output
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-release-

    - name: Install Linux build dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends \
          build-essential clang cmake libasound2-dev libfontconfig1-dev libvulkan1 \
          libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev pkg-config

    - name: Build locked release binary
      run: cargo build --locked --release --verbose

    - name: Build locked CLI for controlled release smoke
      run: cargo build --locked --release -p postman-cli --bin postman-g

    - name: Verify CLI body bytes and Flow fixtures without external services
      shell: bash
      run: |
        binary=target/release/postman-g
        if [ "$RUNNER_OS" = "Windows" ]; then binary="${binary}.exe"; fi
        python3 scripts/release_smoke.py cli --binary "$binary" --output target/cli-smoke.json

    - name: Verify embedded fonts with the native text backend
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "Windows" ]; then
          target/release/postman-gpui.exe --verify-runtime-assets
        else
          target/release/postman-gpui --verify-runtime-assets
        fi

  release-configuration:
    name: Release Configuration
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install SquashFS test tools
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends squashfs-tools

    - name: Test release tooling
      run: python -m unittest discover -s scripts/tests -p 'test_release*.py'

    - name: Validate current release metadata
      run: |
        version=$(PYTHONPATH=scripts python3 -c 'import release; print(release.load_manifest()["version"])')
        python3 scripts/release.py verify --tag "v${version}"

  # Security audit
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Rust toolchain
      run: |
        rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
        rustup default "$RUST_TOOLCHAIN"

    - name: Install cargo-audit
      run: cargo install cargo-audit --locked

    - name: Run security audit
      run: cargo audit
